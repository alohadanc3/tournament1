<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Створити турнір</title>
</head>
<body>
    <h1>Створення нового турніру</h1>
    <a href="{% url 'tournament_list' %}">⬅️ Повернутися до списку</a>

    <form method="post" style="margin-top: 20px; max-width: 400px; display: flex; flex-direction: column; gap: 15px;">
        {% csrf_token %}

        <div>
            <label for="title" style="display:block; margin-bottom:5px;">Назва турніру:</label>
            <input type="text" id="title" name="title" required style="width: 100%; padding: 8px;">
        </div>

        <div>
            <label for="description" style="display:block; margin-bottom:5px;">Опис:</label>
            <textarea id="description" name="description" rows="4" required style="width: 100%; padding: 8px;"></textarea>
        </div>

        <div>
            <label for="date" style="display:block; margin-bottom:5px;">Дата та час проведення:</label>
            <input type="datetime-local" id="date" name="date" required style="width: 100%; padding: 8px;">
        </div>

        <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Опублікувати турнір
        </button>
    </form>
</body>
</html>
